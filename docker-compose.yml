services:

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: ragnarok-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: ragnarok-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragnarok-backend
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_DIR=data/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=ragnarok_documents
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      - qdrant
      - ollama
    restart: on-failure

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: ragnarok-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  prometheus:
    image: prom/prometheus:latest
    container_name: ragnarok-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: ragnarok-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ragnarok
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  qdrant_data:
    external: true
    name: ragnarok_qdrant_data
  ollama_data:
  upload_data:
  mlflow_data:
  grafana_data:
